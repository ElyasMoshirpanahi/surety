name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly: the slow Monte Carlo checks
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -m "not slow"
      - run: surety --help
      - run: python examples/jev_vs_laya/run.py --fake

  slow:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -m slow

  # Live integration against a real Laya (CPU): laya-serve over HTTP plus laya.Router in-process.
  # Weekly and on demand only: it downloads PyTorch and model weights.
  laya:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LAYA_VERSION: "0.3.27"
      LAYA_REVISION: reviewed # load the commit SHAs Laya publishes as reviewed
      LAYA_MODELS: english
      LAYA_HOST: 127.0.0.1
      LAYA_PORT: "8000"
      SURETY_LAYA_URL: http://127.0.0.1:8000
      SURETY_LAYA_INPROCESS: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-laya-${{ env.LAYA_VERSION }}-english
      - name: Install CPU PyTorch, Laya and surety
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "laya[serve]==${LAYA_VERSION}" -e ".[dev]"
      - name: Start laya-serve
        run: |
          nohup laya-serve > laya-serve.log 2>&1 &
          for _ in $(seq 1 180); do
            if curl -fsS "$SURETY_LAYA_URL/health"; then exit 0; fi
            sleep 2
          done
          cat laya-serve.log
          exit 1
      - run: pytest -m laya -v
      - run: python examples/jev_vs_laya/run.py --skip-jev --laya-url "$SURETY_LAYA_URL" --limit 60
      - if: failure()
        run: cat laya-serve.log
