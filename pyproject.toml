[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "surety-gate"
version = "0.2.0"
description = "Statistical guarantees for System One decision models (Jev, Laya, any /v1/systemone server)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Elyas Moshirpanahi" }]
keywords = ["conformal", "selective-classification", "risk-control", "jev", "laya", "systemone"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
sdk = ["typesafe-sdk>=0.7"]
laya = ["laya>=0.3"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
surety = "surety.cli:main"

[project.urls]
Source = "https://github.com/ElyasMoshirpanahi/surety"

[tool.hatch.build.targets.wheel]
packages = ["src/surety"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long statistical simulations (run with -m slow)",
    "laya: live tests against a real Laya; skipped unless SURETY_LAYA_URL / SURETY_LAYA_INPROCESS is set",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["typesafe_sdk", "typesafe_sdk.*", "laya", "laya.*"]
ignore_missing_imports = true
