<svg viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How often the promised error rate is broken: hand-picked threshold vs surety</title>
  <text x="430.0" y="24" font-size="15" font-weight="600" fill="#8b949e" text-anchor="middle">How often the promise “error ≤ 0.1” is broken (2,000 calibration samples of 1,000 rows)</text>
  <rect x="292" y="38" width="12" height="12" rx="2" fill="#d9822b"/><text x="309" y="48" font-size="12" fill="#8b949e">lowest threshold with observed error ≤ α</text>
  <rect x="560" y="38" width="12" height="12" rx="2" fill="#2da44e"/><text x="577" y="48" font-size="12" fill="#8b949e">surety certificate</text>
  <line x1="250.0" y1="70" x2="250.0" y2="246" stroke="#8b949e" stroke-opacity="0.16"/><text x="250.0" y="262" font-size="11" fill="#8b949e" text-anchor="middle">0%</text>
  <line x1="387.5" y1="70" x2="387.5" y2="246" stroke="#8b949e" stroke-opacity="0.16"/><text x="387.5" y="262" font-size="11" fill="#8b949e" text-anchor="middle">25%</text>
  <line x1="525.0" y1="70" x2="525.0" y2="246" stroke="#8b949e" stroke-opacity="0.16"/><text x="525.0" y="262" font-size="11" fill="#8b949e" text-anchor="middle">50%</text>
  <line x1="662.5" y1="70" x2="662.5" y2="246" stroke="#8b949e" stroke-opacity="0.16"/><text x="662.5" y="262" font-size="11" fill="#8b949e" text-anchor="middle">75%</text>
  <line x1="800.0" y1="70" x2="800.0" y2="246" stroke="#8b949e" stroke-opacity="0.16"/><text x="800.0" y="262" font-size="11" fill="#8b949e" text-anchor="middle">100%</text>
  <line x1="305.0" y1="64" x2="305.0" y2="246" stroke="#8b949e" stroke-opacity="0.8" stroke-dasharray="4 4"/><text x="311.0" y="280" font-size="11" fill="#8b949e">allowed: δ = 10%</text>
  <text x="236" y="94" font-size="13" fill="#8b949e" text-anchor="end">Slightly too wrong</text>
  <text x="236" y="111" font-size="10" fill="#8b949e" opacity="0.8" text-anchor="end">true error 0.11 at every confidence</text>
  <rect x="250" y="70" width="511.5" height="26" rx="3" fill="#d9822b"/><text x="769.5" y="88" font-size="12" fill="#d9822b">93.0%</text>
  <rect x="250" y="102" width="2.0" height="26" rx="3" fill="#2da44e"/><text x="260.0" y="120" font-size="12" font-weight="600" fill="#2da44e">0.3%</text>
  <text x="236" y="186" font-size="13" fill="#8b949e" text-anchor="end">Overconfident model</text>
  <text x="236" y="203" font-size="10" fill="#8b949e" opacity="0.8" text-anchor="end">true error 1.5 × (1 − confidence)</text>
  <rect x="250" y="162" width="133.1" height="26" rx="3" fill="#d9822b"/><text x="391.1" y="180" font-size="12" fill="#d9822b">24.2%</text>
  <rect x="250" y="194" width="2.0" height="26" rx="3" fill="#2da44e"/><text x="260.0" y="212" font-size="12" font-weight="600" fill="#2da44e">0.0%</text>
</svg>
